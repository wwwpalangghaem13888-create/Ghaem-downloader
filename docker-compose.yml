services:
  api:
    build: ./backend
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["downloads_data:/downloads"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    security_opt: ["no-new-privileges:true"]

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes: ["downloads_data:/downloads"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    security_opt: ["no-new-privileges:true"]

  bot:
    build: ./backend
    command: ["sh", "-c", "if [ -n \"$BOT_TOKEN\" ]; then python -m app.bot; else echo 'BOT_TOKEN empty; bot disabled'; sleep infinity; fi"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    security_opt: ["no-new-privileges:true"]

  dashboard:
    build: ./dashboard
    env_file: .env
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ghaem
      POSTGRES_USER: ghaem
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghaem -d ghaem"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  downloads_data:
