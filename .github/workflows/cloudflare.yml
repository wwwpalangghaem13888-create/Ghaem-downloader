name: Cloudflare Worker checks
on:
  push:
    branches: ["cloudflare/**"]
  pull_request:
    branches: ["main"]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
