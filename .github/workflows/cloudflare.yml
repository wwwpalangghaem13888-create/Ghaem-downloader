name: Cloudflare Worker checks
on:
  push:
    branches: ["cloudflare/**", "fix/**"]
  pull_request:
    branches: ["main"]
jobs:
  worker-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Validate Wrangler config and build Worker without deploying
        run: npx wrangler deploy --dry-run
